[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-image-project"
version = "0.1.0"
description = "Modular text-to-image generation project exploring conditional GANs, attention mechanisms, and latent diffusion."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]